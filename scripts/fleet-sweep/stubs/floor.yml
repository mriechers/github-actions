name: Floor

# Tier 0 floor from conventions/CI_STANDARDIZATION.md: a full-history secrets
# scan, on every repo, regardless of language. Swept to the fleet by
# scripts/claude-workflow-migration/sweep.sh — this file and
# scripts/claude-workflow-migration/stubs/floor.yml are kept byte-identical so
# the-lodge runs exactly what the fleet gets.

on: [push, pull_request]

jobs:
  floor:
    permissions:
      contents: read
      pull-requests: write # gitleaks comments findings on PRs
    uses: mriechers/github-actions/.github/workflows/floor.yml@191a3e919bfa22c0c5cf2b85cdab4f4290651237 # v1
