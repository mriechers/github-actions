name: JS/TS CI (reusable)

# Workspace-standard JavaScript/TypeScript CI — Tier A reusable. Includes
# the Floor (gitleaks) plus lint, typecheck, and test. Permissive defaults;
# consumer repos can ratchet stricter via their own eslint/tsconfig.
# See the-lodge conventions/CI_STANDARDIZATION.md for the tier model.
#
# Why this lives here and not in the-lodge, which is where the tier model is
# documented: the-lodge is a PRIVATE repo, and a reusable workflow in a private
# repo cannot be called by other repos unless Actions access is explicitly
# widened. This definition sat in the-lodge from its creation until 2026-08-11
# with exactly zero callers fleet-wide — unreachable, not unwanted. Same
# reasoning that moved the floor here; see floor.yml.
#
# Consumers call this as a reusable workflow:
#
#   jobs:
#     js-ci:
#       uses: mriechers/github-actions/.github/workflows/js-ci.yml@<sha>
#       with:
#         node-version: "22"
#         install-cmd: "pnpm install --frozen-lockfile"
#         test-cmd: "pnpm test"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version"
        required: false
        type: string
        default: "20"
      install-cmd:
        description: "Install command (npm ci / pnpm install --frozen-lockfile / yarn install --immutable)"
        required: false
        type: string
        default: "npm ci"
      lint-cmd:
        description: "Lint command — errors-only by default"
        required: false
        type: string
        default: "npx eslint --quiet ."
      typecheck-cmd:
        description: "Typecheck command"
        required: false
        type: string
        default: "npx tsc --noEmit"
      test-cmd:
        description: "Test command (vitest/jest/etc.)"
        required: false
        type: string
        default: "npx vitest run"
      run-tests:
        description: "Set false to skip the test job"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          # Don't leave the token in .git/config for later steps.
          persist-credentials: false
      # The gitleaks CLI, not gitleaks/gitleaks-action: the Action is free only
      # for personal accounts and refuses to scan an ORGANISATION repo without
      # a paid licence key. See floor.yml, which carries the same steps for the
      # same reason. Duplicated rather than nested as a `uses:` because a
      # same-repo reusable must be referenced by full owner/repo@sha, and this
      # repo pinning itself would need bumping on every release.
      - name: Install gitleaks
        env:
          VERSION: '8.30.1'
          SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tgz="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tgz}" \
            -o "$RUNNER_TEMP/$tgz"
          echo "${SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --exit-code 1

  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: eval "$INSTALL_CMD"
      - name: Lint
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
        run: eval "$LINT_CMD"

  typecheck:
    name: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: eval "$INSTALL_CMD"
      - name: Typecheck
        env:
          TYPECHECK_CMD: ${{ inputs.typecheck-cmd }}
        run: eval "$TYPECHECK_CMD"

  test:
    name: tests
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: eval "$INSTALL_CMD"
      - name: Run tests
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
        run: eval "$TEST_CMD"
