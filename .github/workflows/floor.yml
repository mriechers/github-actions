name: Floor (reusable)

# Workspace-standard Tier 0 "floor": a secrets scan of the commits a change
# adds, which every non-archived repo in the fleet should run, regardless of
# language or scale. See docs/ci-standardization.md for the tier model.
#
# It scans the change, not all history. The floor used to re-scan full history
# on every run, so one old finding failed every push from then on: over 60 days
# that was 485 failed runs, 65 pull requests merged with the floor red, and
# about 18 default branches left red for a month. A check that is red whatever
# you push gets ignored, and then it cannot report a new secret either. Old
# history is audited once, on purpose (`full-history: true`, or gitleaks run
# locally), and the result is triaged: rotate what is live, allowlist the rest.
#
# Why this lives here and not in the-lodge, which is where the tier model is
# documented: the-lodge is a PRIVATE repo, and a reusable workflow in a private
# repo cannot be called by other repos unless Actions access is explicitly
# widened. A floor definition that no repo can consume is not a floor. This
# repo is public precisely so the fleet can call one shared definition, so the
# floor belongs here.
#
# Consumers add .github/workflows/floor.yml:
#
#   name: Floor
#   on:
#     pull_request:
#     push:
#       branches: [main, master]
#   jobs:
#     floor:
#       permissions:
#         contents: read
#       uses: mriechers/github-actions/.github/workflows/floor.yml@<sha>
#
# The permissions block must live in the caller — a reusable can only downgrade
# the token it is handed, never widen it.
#
# Trigger on pull requests and on pushes to the default branch only. `on:
# [push, pull_request]` scans every pull-request commit twice and sends two
# failure emails for one finding.
#
# Baselining findings a full-history audit turns up and the repo cannot fix: a
# repo whose history carries vendored or third-party material — reviewed on
# adoption, never hand-edited — has findings no PR can clear.
# Commit a .gitleaks.toml at the repo ROOT and leave gitleaks-config empty; the
# scan resolves a root config on its own (see the input's description below):
#
#   [extend]
#   useDefault = true
#
#   [[allowlists]]
#   description = "Vendored third-party code: reviewed on adoption, no live credentials"
#   paths = ['''^deployments/[^/]+/vendor/.*''']
#
# Prefer path allowlists to a .gitleaksignore of fingerprints. A fingerprint is
# commit:path:rule:line, so on a full-history scan the same
# content re-appears under every commit that ever touched it: the ignore file
# grows with history rather than with content, and re-vendoring invalidates it.
# Measured on one fleet repo, 24 fingerprints covered 16 distinct locations.
#
# Scope an allowlist to the directories that are genuinely not ours. It buys the
# floor back at the cost of not scanning those paths at all, so a real secret
# committed under one would go unreported.

on:
  workflow_call:
    inputs:
      gitleaks-config:
        description: >-
          Optional path, in the calling repo, to a .gitleaks.toml kept somewhere
          other than the repo root. Usually unnecessary, and empty does NOT mean
          "built-in ruleset": gitleaks resolves its config as 1. --config,
          2. $GITLEAKS_CONFIG, 3. $GITLEAKS_CONFIG_TOML, 4. <target>/.gitleaks.toml,
          and only then the built-in rules. The scan target here is the repo root,
          so a .gitleaks.toml committed there applies with this input left empty.
        required: false
        type: string
        default: ''
      fetch-depth:
        description: >-
          Checkout depth. 0 (default) fetches full history, so both ends of the
          commit range being scanned are present. With a shallower checkout the
          range may be missing, and the scan then covers whatever history was
          fetched.
        required: false
        type: number
        default: 0
      full-history:
        description: >-
          Scan every commit instead of only the commits this push or pull
          request adds. For a deliberate one-off audit: a secret that was
          committed and later removed is still published, and only a full scan
          finds it.
        required: false
        type: boolean
        default: false
      runs-on:
        description: >-
          Runner label. The scan takes seconds and every job bills a whole
          minute, so a smaller runner is cheaper for the same result.
        required: false
        type: string
        default: ubuntu-latest

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          # gitleaks only reads the working tree and history; it never pushes.
          # Leaving the token in .git/config would hand every later step in the
          # caller's job a credential this workflow has no reason to grant.
          persist-credentials: false

      # The gitleaks CLI, not gitleaks/gitleaks-action. The Action is free only
      # for personal accounts — on an ORGANISATION repo it exits non-zero with
      # "is an organization. License key is required." That made the floor a
      # permanent red X on all 28 org repos in the fleet while passing on the
      # 54 personal ones. The scanner itself is MIT and has no such gate, so we
      # install the release binary and skip the wrapper.
      - name: Install gitleaks
        env:
          VERSION: '8.30.1'
          SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          tgz="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tgz}" \
            -o "$RUNNER_TEMP/$tgz"
          echo "${SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          # Left in RUNNER_TEMP and called by absolute path rather than
          # installed into /usr/local/bin: nothing here needs to be on PATH,
          # and a directory we already own raises no question about whether
          # the runner user may write to a system one.
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      # Exits 1 when it finds anything, which is what fails the job. --redact
      # keeps the secret itself out of the log: a finding must not publish the
      # thing it is reporting.
      - name: Run gitleaks
        env:
          CONFIG: ${{ inputs.gitleaks-config }}
          FULL_HISTORY: ${{ inputs.full-history }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=(git . --redact --verbose --exit-code 1)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi

          # The commits this event adds: base..head for a pull request,
          # before..after for a push.
          from='' to=''
          if [ "$FULL_HISTORY" != "true" ]; then
            case "$EVENT_NAME" in
              pull_request|pull_request_target) from="$PR_BASE" to="$PR_HEAD" ;;
              push) from="$PUSH_BEFORE" to="$PUSH_AFTER" ;;
            esac
          fi

          # Use the range only when both ends are real commits in this
          # checkout. gitleaks treats a range it cannot resolve as zero commits
          # and exits 0, which would be a green check that scanned nothing. A
          # new branch (before is all zeros), a force-push whose old tip is
          # gone, or any other event therefore gets the full scan.
          if [ -n "$from" ] && [ -n "$to" ] \
             && git cat-file -e "${from}^{commit}" 2>/dev/null \
             && git cat-file -e "${to}^{commit}" 2>/dev/null; then
            echo "Scanning the commits in ${from}..${to}"
            args+=("--log-opts=${from}..${to}")
          else
            echo "Scanning full history"
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"
