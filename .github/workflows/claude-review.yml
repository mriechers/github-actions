name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: 'Model alias or id for --model (default: latest Sonnet)'
        type: string
        default: sonnet
      prompt:
        description: 'Override the review command; empty = default /code-review on the caller PR'
        type: string
        default: ''
      review_label:
        description: 'Label that triggers a review on labeled events'
        type: string
        default: claude-review
    secrets:
      claude_code_oauth_token:
        required: true

jobs:
  claude-review:
    # On `labeled` events only review when the label matches review_label;
    # every other event (opened/synchronize/ready_for_review/reopened) always runs.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == inputs.review_label
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            You are the authoritative reviewer for ${{ github.repository }} PR #${{ github.event.pull_request.number }}.

            1. Ensure these labels exist in the repo; create any missing one with
               `gh label create <name> --color <color> --description <desc> --force`:
               review:new, review:re-review, review:blocker, review:nits,
               review:approved, ship:ready (colors per the pr-review taxonomy).
            2. If the PR has NO review:* label yet, add `review:new` now.
            3. Run `/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}`
               and POST the findings as a summary review comment on the PR.
            4. From the verdict, apply EXACTLY ONE label and remove the other four
               review:* labels (review:new/re-review/blocker/nits/approved):
                 - clean / no actionable findings  -> review:approved
                 - only minor / nit findings        -> review:nits
                 - any must-fix finding             -> review:blocker
               Never touch ship:ready, claude-fix, or no-pr-watch.
          claude_args: '--model ${{ inputs.model }}'
