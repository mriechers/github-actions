name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: 'Model alias or id for --model (default: latest Sonnet)'
        type: string
        default: sonnet
      prompt:
        description: 'Additional or replacement review instructions; empty uses the standard review'
        type: string
        default: ''
      review_label:
        description: 'Label that triggers a review on labeled events'
        type: string
        default: claude-review
      github_app_id:
        description: 'Optional GitHub App ID used to publish the native review state'
        type: string
        default: ''
      protocol_ref:
        description: >-
          Ref of mriechers/github-actions to load the protocol library from.
          Empty uses the SHA of this called workflow, keeping the workflow and
          the taxonomy it executes pinned together.
        type: string
        default: ''
    secrets:
      claude_code_oauth_token:
        required: true
      github_app_private_key:
        required: false
    outputs:
      review_verdict:
        description: 'Machine-readable review verdict: approve, request_changes, comment, or inconclusive'
        value: ${{ jobs.claude-review.outputs.review_verdict }}
      review_label:
        description: 'Machine-readable final review label'
        value: ${{ jobs.claude-review.outputs.review_label }}
      review_mode:
        description: 'publish for same-repository PRs, report-only for fork PRs'
        value: ${{ jobs.claude-review.outputs.review_mode || jobs.fork-report.outputs.review_mode }}

jobs:
  claude-review:
    # Callers choose the event trigger, but this reusable accepts only the review
    # lifecycle events and its configured manual label.
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == inputs.review_label)
      ) &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      review_verdict: ${{ steps.review-result.outputs.verdict }}
      review_label: ${{ steps.review-result.outputs.label }}
      review_mode: ${{ steps.review-context.outputs.mode }}
    steps:
      - name: Determine review mode and available credentials
        id: review-context
        env:
          APP_ID: ${{ inputs.github_app_id }}
          APP_PRIVATE_KEY: ${{ secrets.github_app_private_key }}
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
        run: |
          echo "mode=publish" >> "$GITHUB_OUTPUT"

          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "app_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CLAUDE_TOKEN" ]; then
            echo "claude_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        id: app-token
        if: steps.review-context.outputs.app_configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Determine GitHub API token mode
        id: app-token-context
        env:
          APP_CONFIGURED: ${{ steps.review-context.outputs.app_configured }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          APP_TOKEN: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || '' }}
        run: |
          if [ "$APP_TOKEN_OUTCOME" = "success" ] && [ -n "$APP_TOKEN" ]; then
            echo "app_backed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_backed=false" >> "$GITHUB_OUTPUT"
            if [ "$APP_CONFIGURED" = "true" ]; then
              {
                echo "### GitHub App token fallback"
                echo "GitHub App token creation failed, so publishing will use \`GITHUB_TOKEN\` instead."
                echo "A successfully minted App token is required for formal approval."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout review protocol library
        # The protocol scripts (pr_label.py, review_publish.py) come from the
        # same SHA the consumer pinned this workflow to, so a re-pin moves the
        # workflow and its taxonomy together, atomically.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mriechers/github-actions
          ref: ${{ inputs.protocol_ref != '' && inputs.protocol_ref || github.job_workflow_sha }}
          path: .protocol
          fetch-depth: 1
          persist-credentials: false

      - name: Decide publication eligibility for this head
        id: publication-eligibility
        env:
          GH_TOKEN: ${{ steps.app-token-context.outputs.app_backed == 'true' && steps.app-token.outputs.token || github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?check_name=Claude%20autonomous%20review&per_page=50" \
            | python3 .protocol/scripts/review_publish.py eligibility

          if grep -q '^publish=false$' "$GITHUB_OUTPUT"; then
            {
              echo "### Claude review: skipped"
              echo "Head \`${PR_HEAD_SHA}\`: $(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: >-
          steps.publication-eligibility.outputs.publish == 'true' &&
          steps.review-context.outputs.claude_configured == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # A successfully minted App token takes precedence, so all gh calls
          # use the App identity. Forks never receive an App token.
          GH_TOKEN: ${{ steps.app-token-context.outputs.app_backed == 'true' && steps.app-token.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ steps.app-token-context.outputs.app_backed == 'true' && steps.app-token.outputs.token || github.token }}
          REVIEW_MODE: ${{ steps.review-context.outputs.mode }}
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            You are the authoritative reviewer for ${{ github.repository }} PR #${{ github.event.pull_request.number }}.

            Review the PR diff and relevant repository context. Do not run PR code,
            install dependencies, modify repository files, or use `gh`/GitHub APIs
            to create reviews, comments, labels, checks, or merge PRs. Never merge
            a PR.

            Use the code-review plugin and these caller-supplied review instructions:
            ${{ inputs.prompt }}

            Decide exactly one verdict:
            - `approve`: no actionable findings; a formal APPROVE is appropriate.
            - `request_changes`: at least one must-fix blocker; formal REQUEST_CHANGES.
            - `comment`: only nits or uncertainty; a formal COMMENT, never approval.
            - `inconclusive`: you could not obtain the PR diff or otherwise could
              not establish a verdict. This is not an approval and not a
              request-for-changes; say why in the summary.

            List each finding in `findings` with a stable id of the form
            `pr:${{ github.event.pull_request.number }}:<short-slug>`. If a prior
            review comment on this PR already assigned an id to the same issue,
            reuse that id exactly — ids are how rounds are reconciled. Severity is
            High, Medium, Low, or Nit. A High or Medium finding must cite a `path`
            from this PR's changed files; observations about unchanged files
            belong in the summary as non-blocking follow-ups, never quoted
            verbatim if sensitive, and never as blocking findings.

            Return the validated structured output required by the supplied JSON
            schema. Its summary must be concise Markdown that explains findings and,
            for blockers, includes actionable file/line references when available.
            Do not include labels: the deterministic publisher owns GitHub-visible
            label state.
          claude_args: >-
            --model ${{ inputs.model }} --json-schema
            '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes","comment","inconclusive"]},"summary":{"type":"string","minLength":1},"findings":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","minLength":1},"severity":{"type":"string","enum":["High","Medium","Low","Nit"]},"path":{"type":"string","minLength":1},"summary":{"type":"string","minLength":1}},"required":["id","severity","path","summary"],"additionalProperties":false}}},"required":["verdict","summary"],"additionalProperties":false}'

      - name: Validate machine-readable review result
        id: review-result
        if: >-
          steps.publication-eligibility.outputs.publish == 'true' &&
          steps.review-context.outputs.claude_configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-context.outputs.app_backed == 'true' && steps.app-token.outputs.token || github.token }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Blocking findings are validated against the PR's changed-file set:
          # a path outside the diff cannot block (out-of-scope observations
          # demote to follow-ups; an unobtainable diff demotes the verdict to
          # inconclusive rather than blocking on the whole repository).
          CHANGED_FILES="$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only || true)"
          export CHANGED_FILES
          python3 .protocol/scripts/review_publish.py validate

      - name: Publish formal review, check, and labels
        if: >-
          steps.review-context.outputs.mode == 'publish' &&
          steps.publication-eligibility.outputs.publish == 'true' &&
          steps.review-context.outputs.claude_configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-context.outputs.app_backed == 'true' && steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_LABEL: ${{ steps.review-result.outputs.label }}
          HAS_APP_TOKEN: ${{ steps.app-token-context.outputs.app_backed }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          # Exactly one review:* label, via the canonical state machine — never
          # a bare `gh pr edit`, or the invariant drifts. `set` bootstraps the
          # full taxonomy first.
          python3 .protocol/.claude/skills/pr-watch/scripts/pr_label.py \
            set "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_LABEL"

          REVIEWED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export REVIEWED_AT
          python3 .protocol/scripts/review_publish.py compose

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --input claude-review-request.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            --input claude-review-check.json
          rm -f claude-review-publication.json claude-review-request.json claude-review-check.json

  fork-report:
    # A separate read-only job ensures a repository setting cannot accidentally
    # expose a write-capable token while handling untrusted fork PR content.
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == inputs.review_label)
      ) &&
      github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_mode: ${{ steps.report-mode.outputs.mode }}
    steps:
      - name: Record report-only mode
        id: report-mode
        run: |
          echo "mode=report-only" >> "$GITHUB_OUTPUT"
          {
            echo "### Claude review: report-only"
            echo "This is a fork PR. It was not checked out and no OAuth or GitHub App token,"
            echo "formal review, check run, or labels were published."
          } >> "$GITHUB_STEP_SUMMARY"
